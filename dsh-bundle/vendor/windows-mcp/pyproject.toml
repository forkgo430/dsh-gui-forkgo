[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-mcp"
version = "0.8.9+dsh.local"
description = "Windows-MCP with a VirtualDesktop tool bolted on (local DSH fork)."
readme = "README.local.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "click>=8.2.1",
    "comtypes>=1.4.15",
    "dxcam>=0.3.0",
    "fastmcp>=3.0",
    "fuzzywuzzy>=0.18.0",
    "markdownify>=1.1.0",
    "pillow>=11.2.1",
    "platformdirs>=4.3.8",
    "posthog>=7.4.0",
    "psutil>=7.0.0",
    "pygments>=2.20.0",
    "python-levenshtein>=0.27.1",
    "pywin32>=311",
    "requests>=2.33.0",
    "tabulate>=0.9.0",
    "thefuzz>=0.22.1",
    "uuid7>=0.1.0",
]

[project.scripts]
windows-mcp = "windows_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["windows_mcp*"]

[tool.setuptools.package-data]
"*" = ["*.json"]
