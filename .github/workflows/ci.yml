name: CI

# 门禁的意义：这个 bundle 有三处"改对了也看不出来"的坑。
# 没有一个地方会因为这些而失败，所以这里把它们变成硬失败：
#   1) 包结构不对（dsh 装不上，或装上了但技能不加载）
#   2) 技能 frontmatter 缺 description（dsh 静默跳过，用户只看到"AI 不会用"）
#   3) 本地分支的痕迹丢失（屏幕文案退回英文、VirtualDesktop 消失）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 结构 + 技能门禁。不需要 Windows，也不需要起 MCP 子进程。
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 项目结构自检
        working-directory: dsh-bundle
        run: node selftest.js --no-connect
        # 验：dsh.bundle.patch / args 无相对路径 / bundle 元数据完整 /
        # 技能 frontmatter（name kebab-case 且与目录名一致、description 非空）。

      - name: 版本三处一致
        run: |
          node -e "
          const fs = require('fs');
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const bundle = JSON.parse(fs.readFileSync('dsh-bundle/package.json', 'utf8'));
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          let bad = 0;
          const ok = (m) => console.log('  ✓ ' + m);
          const fail = (m) => { bad++; console.error('  ✗ ' + m); };

          if (root.version === bundle.version) ok('根 package.json 与 dsh-bundle 版本一致: ' + root.version);
          else fail('版本漂移: 根 ' + root.version + ' vs bundle ' + bundle.version);

          if (changelog.includes('## ' + bundle.version)) ok('CHANGELOG 有 ' + bundle.version + ' 的条目');
          else fail('CHANGELOG 缺 ' + bundle.version + ' 的条目');

          // bundle 里不许出现还没写的文件引用
          for (const f of bundle.files ?? []) {
            const p = 'dsh-bundle/' + f;
            if (!fs.existsSync(p)) fail('package.json files 里列了不存在的: ' + f);
          }
          ok('package.json 的 files 全部存在');
          process.exit(bad ? 1 : 0);
          "

      - name: 技能目录与 files 声明一致
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('dsh-bundle/package.json', 'utf8'));
          const skills = fs.readdirSync('dsh-bundle/skills', { withFileTypes: true })
            .filter(d => d.isDirectory()).map(d => d.name);
          const declared = (pkg.files ?? []).some(f => f === 'skills' || f.startsWith('skills/'));
          console.log('  技能目录: ' + (skills.join(', ') || '(无)'));
          if (skills.length && !declared) {
            console.error('  ✗ 有 skills/ 但 package.json 的 files 没声明，发布后会丢');
            process.exit(1);
          }
          console.log('  ✓ 技能目录已在 files 里声明');
          "

  # 连接层门禁。必须 Windows：uvx 要拉 Python 3.14 + pywin32 + comtypes，
  # 而且 windows-mcp 本身 import win32gui。Linux runner 上必然假绿或直接 ERROR。
  connect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: astral-sh/setup-uv@v3

      - name: 预热 uvx（拉 Python 3.14 与依赖，避免首次握手超 90s）
        run: uvx --python 3.14 --from windows-mcp windows-mcp --help
        continue-on-error: true
        # 上游包在 PyPI 上是可得的；这一步只是把依赖拉进缓存。

      - name: 连接层自检（起 stdio、列工具）
        working-directory: dsh-bundle
        run: node selftest.js
        # 验：initialize / tools/list / 15 个工具 / 字符集合规 / ≤64 字符。
        # 注意：CI 上没有本地分支的 PYTHONPATH，所以 VirtualDesktop 与中文文案
        # 两项会跳过（selftest 里按 pythonPath 是否存在决定是否检查）。

  # 文档门禁：README 里提到的工具数、能不能装，别写漂。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: README 与 bundle 自洽
        run: |
          node -e "
          const fs = require('fs');
          const readme = fs.readFileSync('README.md', 'utf8');
          const pkg = JSON.parse(fs.readFileSync('dsh-bundle/package.json', 'utf8'));
          let bad = 0;
          const ok = (m) => console.log('  ✓ ' + m);
          const fail = (m) => { bad++; console.error('  ✗ ' + m); };

          if (readme.includes(pkg.name)) ok('README 提到的包名与 package.json 一致: ' + pkg.name);
          else fail('README 里的包名与 ' + pkg.name + ' 不一致');

          // 工具数从 selftest 的 EXPECTED_TOOL_COUNT 取，README 必须写出同一个数字。
          // 写死数字的话，下次合并工具又得改三处。
          const expected = (() => {
            const st = fs.readFileSync('dsh-bundle/selftest.js', 'utf8');
            const m = st.match(/EXPECTED_TOOL_COUNT\s*=\s*(\d+)/);
            return m ? parseInt(m[1], 10) : null;
          })();
          if (expected && new RegExp(expected + ' 个工具').test(readme)) {
            ok('README 的工具数与实现一致: ' + expected);
          } else {
            fail('README 的工具数与 selftest 对不上（期望 ' + expected + '）');
          }

          if (readme.includes('VirtualDesktop')) ok('README 提到 VirtualDesktop');
          else fail('README 没提 VirtualDesktop（本仓存在的理由）');

          if (fs.existsSync('LICENSE')) ok('LICENSE 存在');
          else fail('缺 LICENSE');

          if (fs.existsSync('CHANGELOG.md')) ok('CHANGELOG.md 存在');
          else fail('缺 CHANGELOG.md');

          process.exit(bad ? 1 : 0);
          "
